name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          python -m netlistlabel analyze examples/generic_ota/generic_ota.sp --out out/generic_ota
          python -m compileall -q netlistlabel
      - name: Demo + gold evaluation
        run: ./scripts/demo.sh