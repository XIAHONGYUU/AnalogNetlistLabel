<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Noto Sans CJK SC, Noto Sans, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55708a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>

  <text x="44" y="58" font-size="34" font-weight="700" fill="#111827">AnalogNetlistLabel：从大网表到可复核语义</text>
  <text x="44" y="88" font-size="16" fill="#5b6573">先分解，再标注 · 开源模拟网表 ↔ AI 的语义接口</text>

  <line x1="44" y1="108" x2="78" y2="108" stroke="#0f9d8a" stroke-width="3"/>
  <text x="86" y="113" font-size="11.5" fill="#5b6573">已跑通</text>
  <line x1="146" y1="108" x2="180" y2="108" stroke="#2f6fed" stroke-width="3"/>
  <text x="188" y="113" font-size="11.5" fill="#5b6573">下一步</text>
  <line x1="248" y1="108" x2="282" y2="108" stroke="#d97706" stroke-width="3"/>
  <text x="290" y="113" font-size="11.5" fill="#5b6573">下游方向</text>
  <text x="1156" y="113" font-size="11.5" fill="#8a94a3" text-anchor="end">v0.2.0 demo · source read-only</text>

  <!-- top flow -->
  <g>
    <rect x="44" y="140" width="212" height="224" rx="10" fill="#eef7f1" stroke="#9cc9aa"/>
    <circle cx="66" cy="166" r="13" fill="#0f9d8a"/>
    <text x="66" y="171" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="88" y="171" font-size="18" font-weight="700" fill="#1f2937">大网表</text>
    <text x="66" y="204" font-size="11" font-weight="700" fill="#0f766e">INPUT</text>
    <text x="66" y="230" font-size="12.5" fill="#374151">top + 很多 subckt</text>
    <text x="66" y="252" font-size="12.5" fill="#374151">通用名、无 GUI</text>
    <rect x="66" y="274" width="168" height="26" rx="5" fill="#ffffff" stroke="#cfe5d5"/>
    <text x="76" y="291" font-size="10.5" font-family="Noto Sans Mono CJK SC, monospace" fill="#0f766e">top.sp / subckt</text>
    <text x="66" y="326" font-size="10.5" fill="#6b7280">名字是 prior，不是事实</text>
    <text x="66" y="346" font-size="10.5" fill="#6b7280">结构是 evidence</text>

    <line x1="264" y1="252" x2="286" y2="252" stroke="#55708a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="292" y="140" width="212" height="224" rx="10" fill="#eef5fc" stroke="#a8c8e8"/>
    <circle cx="314" cy="166" r="13" fill="#2f6fed"/>
    <text x="314" y="171" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="336" y="171" font-size="18" font-weight="700" fill="#1f2937">层层拆解</text>
    <text x="314" y="204" font-size="11" font-weight="700" fill="#1d4ed8">DECOMPOSE</text>
    <text x="314" y="230" font-size="12.5" fill="#374151">top interface</text>
    <text x="314" y="252" font-size="12.5" fill="#374151">subckt / cell</text>
    <text x="314" y="274" font-size="12.5" fill="#374151">逐层下钻</text>
    <rect x="314" y="296" width="168" height="26" rx="5" fill="#ffffff" stroke="#c9def2"/>
    <text x="324" y="313" font-size="10.5" fill="#1d4ed8">不把整图当一团</text>
    <text x="314" y="346" font-size="10.5" fill="#6b7280">先看 port / supply / control</text>

    <line x1="512" y1="252" x2="534" y2="252" stroke="#55708a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="540" y="140" width="212" height="224" rx="10" fill="#fff7ea" stroke="#e8c48a"/>
    <circle cx="562" cy="166" r="13" fill="#d97706"/>
    <text x="562" y="171" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="584" y="171" font-size="18" font-weight="700" fill="#1f2937">leaf annotation</text>
    <text x="562" y="204" font-size="11" font-weight="700" fill="#9a3412">CURRENT v0.2</text>
    <text x="562" y="230" font-size="12.5" fill="#374151">ports · devices</text>
    <text x="562" y="252" font-size="12.5" fill="#374151">nets · blocks</text>
    <text x="562" y="274" font-size="12.5" fill="#374151">evidence · confidence</text>
    <rect x="562" y="296" width="168" height="26" rx="5" fill="#ffffff" stroke="#f0d3a8"/>
    <text x="572" y="313" font-size="10.5" fill="#9a3412">review: auto / confirm / unknown</text>
    <text x="562" y="346" font-size="10.5" fill="#6b7280">LDO 41/41 · OTA 26/26</text>

    <line x1="760" y1="252" x2="782" y2="252" stroke="#55708a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="788" y="140" width="212" height="224" rx="10" fill="#f6f1fc" stroke="#c9b6e6"/>
    <circle cx="810" cy="166" r="13" fill="#7c3aed"/>
    <text x="810" y="171" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="832" y="171" font-size="18" font-weight="700" fill="#1f2937">语义 overlay</text>
    <text x="810" y="204" font-size="11" font-weight="700" fill="#6d28d9">SEMANTIC LAYER</text>
    <text x="810" y="230" font-size="12.5" fill="#374151">role · match</text>
    <text x="810" y="252" font-size="12.5" fill="#374151">net class · block</text>
    <text x="810" y="274" font-size="12.5" fill="#374151">保留原名字/层次</text>
    <rect x="810" y="296" width="168" height="26" rx="5" fill="#ffffff" stroke="#ded0ef"/>
    <text x="820" y="313" font-size="10.5" fill="#6d28d9">overlay, not rename</text>
    <text x="810" y="346" font-size="10.5" fill="#6b7280">源网表只读</text>

    <line x1="1008" y1="252" x2="1030" y2="252" stroke="#55708a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1036" y="140" width="120" height="224" rx="10" fill="#eaf7f4" stroke="#9fd3c8"/>
    <circle cx="1058" cy="166" r="13" fill="#0f766e"/>
    <text x="1058" y="171" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1080" y="171" font-size="18" font-weight="700" fill="#1f2937">AI</text>
    <text x="1058" y="204" font-size="11" font-weight="700" fill="#0f766e">INTERFACE</text>
    <text x="1058" y="230" font-size="12.5" fill="#374151">semantic</text>
    <text x="1058" y="252" font-size="12.5" fill="#374151">index</text>
    <text x="1058" y="274" font-size="12.5" fill="#374151">search</text>
    <text x="1058" y="296" font-size="12.5" fill="#374151">compare</text>
    <text x="1058" y="326" font-size="10.5" fill="#6b7280">下游见下</text>
  </g>

  <!-- downstream directions -->
  <text x="44" y="410" font-size="13" font-weight="700" fill="#5b6573" letter-spacing="1.2">四个下游方向</text>
  <text x="160" y="410" font-size="12" fill="#8a94a3">不是现在就能替代签核；是语义层走通后的应用空间</text>

  <g>
    <rect x="44" y="430" width="270" height="182" rx="10" fill="#eef7f1" stroke="#9cc9aa"/>
    <text x="64" y="458" font-size="11" font-weight="700" fill="#0f766e">01 / CORPUS</text>
    <text x="64" y="484" font-size="17" font-weight="700" fill="#1f2937">开源素材库 ↔ AI</text>
    <text x="64" y="508" font-size="11.5" fill="#374151">公开网表只有大 .sp，没有 GUI；</text>
    <text x="64" y="528" font-size="11.5" fill="#374151">语义索引让模型能搜索、比较、问答。</text>
    <text x="64" y="554" font-size="10.5" fill="#6b7280">semantic index · retrieval</text>
    <text x="64" y="582" font-size="11" fill="#0f766e">现在：leaf-cell 语义索引</text>

    <rect x="332" y="430" width="270" height="182" rx="10" fill="#fff7ea" stroke="#e8c48a"/>
    <text x="352" y="458" font-size="11" font-weight="700" fill="#9a3412">02 / CHECK</text>
    <text x="352" y="484" font-size="17" font-weight="700" fill="#1f2937">PERC-like 检查</text>
    <text x="352" y="508" font-size="11.5" fill="#374151">浮空 gate / bias 缺失 / drive 冲突</text>
    <text x="352" y="528" font-size="11.5" fill="#374151">body/well / GUI 低级连接错误</text>
    <text x="352" y="554" font-size="10.5" fill="#6b7280">规则判定 + 人工 review</text>
    <text x="352" y="582" font-size="11" fill="#9a3412">不是 PERC 签核替代</text>

    <rect x="620" y="430" width="270" height="182" rx="10" fill="#eef5fc" stroke="#a8c8e8"/>
    <text x="640" y="458" font-size="11" font-weight="700" fill="#1d4ed8">03 / LAYOUT</text>
    <text x="640" y="484" font-size="17" font-weight="700" fill="#1f2937">整体版图检查</text>
    <text x="640" y="508" font-size="11.5" fill="#374151">hierarchy + role + match group；</text>
    <text x="640" y="528" font-size="11.5" fill="#374151">分组、对称、bias 走线、镜像。</text>
    <text x="640" y="554" font-size="10.5" fill="#6b7280">layout review · not DRC/LVS</text>
    <text x="640" y="582" font-size="11" fill="#1d4ed8">现在：语义上下文辅助</text>

    <rect x="908" y="430" width="248" height="182" rx="10" fill="#f6f1fc" stroke="#c9b6e6"/>
    <text x="928" y="458" font-size="11" font-weight="700" fill="#6d28d9">04 / EDIT</text>
    <text x="928" y="484" font-size="17" font-weight="700" fill="#1f2937">AI 驱动网表修改</text>
    <text x="928" y="508" font-size="11.5" fill="#374151">语义上下文中的 repair / 修改，</text>
    <text x="928" y="528" font-size="11.5" fill="#374151">再跑验证，接近 vibe analog。</text>
    <text x="928" y="554" font-size="10.5" fill="#6b7280">read-only now · edit later</text>
    <text x="928" y="582" font-size="11" fill="#6d28d9">现在：只读分析</text>
  </g>

  <line x1="44" y1="640" x2="1156" y2="640" stroke="#dbe4f0"/>
  <text x="44" y="666" font-size="11.5" fill="#5b6573">NOW  leaf-cell annotation：LDO 41/41 MOS · OTA 26/26 · 41 tests</text>
  <text x="44" y="690" font-size="11.5" fill="#5b6573">NEXT  full-netlist / subckt selection / 跨层聚合　　LATER  post-sim / mixed-signal / logic-aware</text>
  <text x="1156" y="690" font-size="10.5" fill="#8a94a3" text-anchor="end">demo, not signoff</text>
</svg>
