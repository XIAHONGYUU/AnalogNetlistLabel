<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Noto Sans CJK SC, Noto Sans, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f6f8fc"/>
  <circle cx="1120" cy="70" r="150" fill="#e8efff" opacity="0.7"/>
  <circle cx="80" cy="650" r="120" fill="#e7f7f3" opacity="0.7"/>

  <text x="56" y="70" font-size="40" font-weight="700" fill="#111827">AnalogNetlistLabel</text>
  <text x="56" y="106" font-size="21" fill="#4b5563">陌生模拟网表 → 可复核的语义层</text>
  <rect x="56" y="122" width="168" height="30" rx="15" fill="#e8efff" stroke="#c7d7ff"/>
  <text x="72" y="143" font-size="15" font-weight="600" fill="#2f6fed">v0.2.0 demo</text>
  <text x="240" y="143" font-size="15" fill="#6b7280">port-first · evidence · review</text>

  <!-- input -->
  <rect x="56" y="180" width="286" height="380" rx="18" fill="#ffffff" stroke="#dfe5f0" filter="url(#shadow)"/>
  <text x="80" y="214" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.5">INPUT</text>
  <text x="80" y="244" font-size="22" font-weight="700" fill="#111827">unknown .sp</text>
  <text x="80" y="270" font-size="14" fill="#6b7280">只有连接、尺寸和通用名</text>
  <rect x="80" y="292" width="238" height="238" rx="12" fill="#0f172a"/>
  <g fill="#dbeafe" font-family="Noto Sans Mono CJK SC, monospace" font-size="12.5">
    <text x="96" y="320" fill="#93c5fd">* no role=, no group=</text>
    <text x="96" y="344">XM46 VX VBIAS_P AVDD</text>
    <text x="96" y="366">     L=7 W=1 nf=1 m=1</text>
    <text x="96" y="390">XM52 VX VREF net1 AVSS</text>
    <text x="96" y="412">     L=0.5 W=2 nf=1 m=1</text>
    <text x="96" y="436">XM59 AVSS VERR VPASS</text>
    <text x="96" y="458">     L=0.5 W=1 nf=1 m=1</text>
    <text x="96" y="482" fill="#93c5fd">... 41 MOS</text>
  </g>
  <text x="80" y="548" font-size="13" fill="#6b7280">源文件只读 · 原始名字保留</text>

  <!-- pipeline -->
  <rect x="376" y="180" width="380" height="380" rx="18" fill="#ffffff" stroke="#dfe5f0" filter="url(#shadow)"/>
  <text x="400" y="214" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.5">PIPELINE</text>
  <text x="400" y="244" font-size="22" font-weight="700" fill="#111827">facts → candidates → review</text>

  <rect x="400" y="268" width="332" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="424" cy="294" r="12" fill="#2f6fed"/>
  <text x="424" y="299" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="448" y="289" font-size="15" font-weight="700" fill="#111827">parse + facts</text>
  <text x="448" y="309" font-size="12.5" fill="#6b7280">MOS / R / C / subckt · rails · diode · pair</text>

  <line x1="566" y1="322" x2="566" y2="342" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="350" width="332" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="424" cy="376" r="12" fill="#0f9d8a"/>
  <text x="424" y="381" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="448" y="371" font-size="15" font-weight="700" fill="#111827">port-first semantics</text>
  <text x="448" y="391" font-size="12.5" fill="#6b7280">direction · class · interface · anchors</text>

  <line x1="566" y1="404" x2="566" y2="424" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="432" width="332" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="424" cy="458" r="12" fill="#d97706"/>
  <text x="424" y="463" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="448" y="453" font-size="15" font-weight="700" fill="#111827">roles + evidence</text>
  <text x="448" y="473" font-size="12.5" fill="#6b7280">candidate score · margin · abstain</text>

  <line x1="566" y1="486" x2="566" y2="506" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="514" width="332" height="28" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="416" y="533" font-size="13" font-weight="600" fill="#3730a3">human review / smoke gold</text>
  <text x="632" y="533" font-size="13" fill="#4f46e5">58/58 accepted</text>

  <!-- output -->
  <rect x="800" y="180" width="344" height="380" rx="18" fill="#ffffff" stroke="#dfe5f0" filter="url(#shadow)"/>
  <text x="824" y="214" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.5">OUTPUT</text>
  <text x="824" y="244" font-size="22" font-weight="700" fill="#111827">semantic overlay</text>

  <rect x="824" y="268" width="296" height="180" rx="12" fill="#fbfdff" stroke="#cfd8e6"/>
  <text x="844" y="296" font-size="13" fill="#6b7280">device card</text>
  <text x="844" y="326" font-size="24" font-weight="700" fill="#111827">XM59</text>
  <rect x="910" y="307" width="112" height="24" rx="12" fill="#e7f7f3" stroke="#b7e4d8"/>
  <text x="966" y="324" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">output_stage</text>
  <text x="844" y="354" font-size="13" fill="#374151">W/L 1/0.5 · nf/m 1/1</text>
  <g font-size="12.5" fill="#111827">
    <rect x="844" y="368" width="66" height="28" rx="6" fill="#f1f5f9"/><text x="852" y="387">D AVSS</text>
    <rect x="918" y="368" width="66" height="28" rx="6" fill="#f1f5f9"/><text x="926" y="387">G VERR</text>
    <rect x="992" y="368" width="78" height="28" rx="6" fill="#f1f5f9"/><text x="1000" y="387">S VPASS</text>
    <rect x="844" y="404" width="70" height="28" rx="6" fill="#f1f5f9"/><text x="852" y="423">B AVDD</text>
  </g>
  <rect x="924" y="404" width="146" height="28" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="936" y="423" font-size="12.5" fill="#9a3412">structure: source_follower</text>

  <rect x="824" y="466" width="296" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="840" y="488" font-size="12" font-weight="700" fill="#6b7280">EVIDENCE</text>
  <text x="840" y="509" font-size="12" fill="#374151">source VPASS 驱动 pass device gate</text>

  <rect x="824" y="536" width="296" height="24" rx="7" fill="#eef2ff"/>
  <text x="838" y="553" font-size="12" fill="#4338ca">review: auto · confidence 0.72 · margin 0.37</text>

  <!-- bottom metrics -->
  <rect x="56" y="596" width="1088" height="70" rx="16" fill="#0f172a"/>
  <g fill="#e5e7eb" font-size="13">
    <text x="84" y="626" font-weight="700" fill="#ffffff">LDO</text><text x="84" y="646">41/41 MOS</text>
    <text x="234" y="626" font-weight="700" fill="#ffffff">OTA</text><text x="234" y="646">26/26 items</text>
    <text x="384" y="626" font-weight="700" fill="#ffffff">GOLD</text><text x="384" y="646">58/58 accepted</text>
    <text x="566" y="626" font-weight="700" fill="#ffffff">TESTS</text><text x="566" y="646">41 passing</text>
    <text x="716" y="626" font-weight="700" fill="#ffffff">CI</text><text x="716" y="646">3.11 / 3.12</text>
    <text x="846" y="626" font-weight="700" fill="#ffffff">SOURCE</text><text x="846" y="646">read-only</text>
  </g>
  <circle cx="1108" cy="631" r="6" fill="#34d399"/>
  <text x="1084" y="654" font-size="11" fill="#9ca3af" text-anchor="end">demo · not signoff</text>
</svg>