<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Noto Sans CJK SC, Noto Sans, Segoe UI, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55708a"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>

  <text x="44" y="56" font-size="30" font-weight="700" fill="#111827">一个已经跑通的例子：XM59</text>
  <text x="44" y="84" font-size="15" fill="#5b6573">从一行网表，到事实、证据、决策；不是黑盒标签，也不是 demo 全貌。</text>

  <!-- 1 netlist -->
  <rect x="44" y="122" width="260" height="360" rx="10" fill="#eef7f1" stroke="#9cc9aa"/>
  <text x="64" y="150" font-size="11" font-weight="700" fill="#0f766e">01 / 网表行</text>
  <text x="64" y="178" font-size="18" font-weight="700" fill="#1f2937">原始输入</text>
  <rect x="64" y="196" width="220" height="128" rx="7" fill="#ffffff" stroke="#cfe5d5"/>
  <g font-family="Noto Sans Mono CJK SC, monospace" font-size="11" fill="#0f766e">
    <text x="76" y="220">XM59 AVSS VERR</text>
    <text x="76" y="240">     VPASS AVDD</text>
    <text x="76" y="260">     pfet L=0.5 W=1</text>
    <text x="76" y="280">     nf=1 m=1</text>
  </g>
  <text x="64" y="350" font-size="11" fill="#374151">W/L 1/0.5 · nf/m 1/1</text>
  <text x="64" y="372" font-size="11" fill="#374151">没有 role=，没有 group=</text>
  <text x="64" y="394" font-size="10.5" fill="#6b7280">名字只说明它是 XM59</text>
  <rect x="64" y="416" width="220" height="26" rx="5" fill="#ffffff" stroke="#cfe5d5"/>
  <text x="74" y="433" font-size="10.5" fill="#0f766e">D AVSS · G VERR · S VPASS · B AVDD</text>

  <line x1="304" y1="302" x2="322" y2="302" stroke="#55708a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 facts -->
  <rect x="330" y="122" width="260" height="360" rx="10" fill="#eef5fc" stroke="#a8c8e8"/>
  <text x="350" y="150" font-size="11" font-weight="700" fill="#1d4ed8">02 / 事实</text>
  <text x="350" y="178" font-size="18" font-weight="700" fill="#1f2937">先确定连接</text>
  <g font-size="11">
    <rect x="350" y="198" width="108" height="44" rx="6" fill="#ffffff" stroke="#c9def2"/>
    <text x="360" y="216" font-size="9.5" fill="#6b7280">DRAIN</text><text x="360" y="233" font-weight="700" fill="#1f2937">AVSS</text>
    <rect x="468" y="198" width="102" height="44" rx="6" fill="#ffffff" stroke="#c9def2"/>
    <text x="478" y="216" font-size="9.5" fill="#6b7280">GATE</text><text x="478" y="233" font-weight="700" fill="#1f2937">VERR</text>
    <rect x="350" y="252" width="108" height="44" rx="6" fill="#ffffff" stroke="#c9def2"/>
    <text x="360" y="270" font-size="9.5" fill="#6b7280">SOURCE</text><text x="360" y="287" font-weight="700" fill="#1f2937">VPASS</text>
    <rect x="468" y="252" width="102" height="44" rx="6" fill="#ffffff" stroke="#c9def2"/>
    <text x="478" y="270" font-size="9.5" fill="#6b7280">BULK</text><text x="478" y="287" font-weight="700" fill="#1f2937">AVDD</text>
  </g>
  <text x="350" y="330" font-size="11" fill="#374151">drain 接轨；source 不是轨</text>
  <text x="350" y="352" font-size="11" fill="#374151">source 驱动 pass device gate</text>
  <text x="350" y="374" font-size="11" fill="#374151">gate 是高阻 gain node</text>
  <rect x="350" y="394" width="220" height="26" rx="5" fill="#ffffff" stroke="#c9def2"/>
  <text x="360" y="411" font-size="10.5" fill="#1d4ed8">facts 只陈述可核对连接</text>

  <line x1="590" y1="302" x2="608" y2="302" stroke="#55708a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 evidence -->
  <rect x="616" y="122" width="260" height="360" rx="10" fill="#fff7ea" stroke="#e8c48a"/>
  <text x="636" y="150" font-size="11" font-weight="700" fill="#9a3412">03 / 证据</text>
  <text x="636" y="178" font-size="18" font-weight="700" fill="#1f2937">结构支持什么</text>
  <text x="636" y="206" font-size="11" fill="#374151">• source VPASS 驱动 pass gate</text>
  <text x="636" y="228" font-size="11" fill="#374151">• drain 接 AVSS，source 输出</text>
  <text x="636" y="250" font-size="11" fill="#374151">• gate VERR 是高阻输入</text>
  <text x="636" y="272" font-size="11" fill="#374151">• 电流由 XM60 提供</text>
  <rect x="636" y="294" width="106" height="26" rx="5" fill="#ffffff" stroke="#f0d3a8"/>
  <text x="646" y="311" font-size="10.5" fill="#9a3412">pass_driver</text>
  <rect x="750" y="294" width="110" height="26" rx="5" fill="#ffffff" stroke="#f0d3a8"/>
  <text x="760" y="311" font-size="10.5" fill="#9a3412">source_follower</text>
  <text x="636" y="350" font-size="11" fill="#374151">低置信度/竞争候选进 review，</text>
  <text x="636" y="372" font-size="11" fill="#374151">不静默覆盖。</text>
  <rect x="636" y="394" width="220" height="26" rx="5" fill="#ffffff" stroke="#f0d3a8"/>
  <text x="646" y="411" font-size="10.5" fill="#9a3412">evidence 必须能回到器件/节点</text>

  <line x1="876" y1="302" x2="894" y2="302" stroke="#55708a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 decision -->
  <rect x="902" y="122" width="254" height="360" rx="10" fill="#f6f1fc" stroke="#c9b6e6"/>
  <text x="922" y="150" font-size="11" font-weight="700" fill="#6d28d9">04 / 决策</text>
  <text x="922" y="178" font-size="18" font-weight="700" fill="#1f2937">可复核的标签</text>
  <text x="922" y="212" font-size="22" font-weight="700" fill="#1f2937">output_stage</text>
  <text x="922" y="236" font-size="11" fill="#6b7280">group OUT · match —</text>
  <rect x="922" y="252" width="102" height="24" rx="5" fill="#ffffff" stroke="#ded0ef"/>
  <text x="932" y="268" font-size="10.5" fill="#6d28d9">source_follower</text>
  <text x="922" y="302" font-size="11" fill="#374151">confidence 0.72</text>
  <text x="922" y="324" font-size="11" fill="#374151">margin 0.37</text>
  <text x="922" y="346" font-size="11" fill="#374151">review auto</text>
  <rect x="922" y="368" width="70" height="26" rx="5" fill="#0f9d8a"/>
  <text x="957" y="385" font-size="10.5" fill="#ffffff" text-anchor="middle">accept</text>
  <rect x="1000" y="368" width="66" height="26" rx="5" fill="#ffffff" stroke="#e8c48a"/>
  <text x="1033" y="385" font-size="10.5" fill="#9a3412" text-anchor="middle">correct</text>
  <rect x="1074" y="368" width="62" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1105" y="385" font-size="10" fill="#475569" text-anchor="middle">ambiguous</text>
  <text x="922" y="426" font-size="10" fill="#6b7280">人工可以接受/纠正/标歧义</text>

  <!-- footer -->
  <rect x="44" y="512" width="1112" height="72" rx="10" fill="#ffffff" stroke="#dfe5f0"/>
  <text x="64" y="540" font-size="11" font-weight="700" fill="#5b6573">DEMO SNAPSHOT</text>
  <text x="64" y="562" font-size="12" fill="#1f2937">LDO 41/41 MOS · OTA 26/26 · gold 58/58 · 41 tests · CI</text>
  <text x="1124" y="562" font-size="10.5" fill="#8a94a3" text-anchor="end">leaf-cell annotation · not signoff</text>
</svg>
